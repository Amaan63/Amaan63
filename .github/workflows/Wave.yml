name: GitHub Wave Animation  

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate-wave:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out the repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Generate a custom wave contribution calendar
      - name: Generate Wave Animation
        uses: yochananl/wave-art-action@v1.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          output: "wave-contributions.svg"
          color_wave: "#1db954" # Customize the wave color
          style: "smooth" # Choose from 'smooth', 'wavy', or 'sharp'

      # Step 3: Deploy the generated wave to the repo
      - name: Commit and Push Wave
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Update GitHub Wave Contribution Animation 🌊"
          file_pattern: "wave-contributions.svg"

